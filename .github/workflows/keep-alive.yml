name: Keep Supabase awake

# Supabase Free pausa el proyecto después de 7 días sin tráfico
# (SPEC.md sección 3). Esto le pega al health-check una vez por semana
# durante todo el desarrollo, para que nunca se pause por accidente.
on:
  schedule:
    - cron: '0 12 * * 1' # todos los lunes a las 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pegarle al health-check
        run: curl --fail --retry 3 --retry-delay 5 "https://inesaliva50.vercel.app/api/health"
