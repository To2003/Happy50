name: Keep Supabase awake

# Supabase Free pausa el proyecto después de 7 días sin tráfico
# (SPEC.md sección 3). Probado en la práctica: pegarle una vez por semana
# no alcanzó — el proyecto se pausó igual antes de la tercera corrida
# semanal (quedaba justo en el límite de los 7 días). Pasado a diario
# para tener margen de sobra.
on:
  schedule:
    - cron: '0 12 * * *' # todos los días a las 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pegarle al health-check
        run: curl --fail --retry 3 --retry-delay 5 "https://inesaliva50.vercel.app/api/health"
